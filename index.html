<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>音符大作戰：城堡守衛戰 (Note Defense)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部狀態欄 */
    #header {
      height: 56px;
      background: rgba(18, 24, 38, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 2px solid #1e293b;
      z-index: 10;
    }
    .header-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }
    .icon-btn:active {
      transform: scale(0.92);
      background: #334155;
    }
    .hearts {
      display: flex;
      gap: 4px;
      font-size: 20px;
    }
    .heart {
      color: #ef4444;
      filter: drop-shadow(0 0 4px rgba(239,68,68,0.5));
    }
    .heart.empty {
      color: #475569;
      filter: none;
    }

    /* 關卡資訊與模式 */
    .mode-badge {
      background: #f59e0b;
      color: #000;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
      white-space: nowrap;
    }
    .mode-info {
      font-size: 13px;
      font-weight: bold;
      color: #cbd5e1;
      white-space: nowrap;
    }

    /* 右側得分 */
    .score-box {
      text-align: right;
      line-height: 1.1;
    }
    .score-title {
      font-size: 10px;
      color: #94a3b8;
      letter-spacing: 1px;
    }
    .score-val {
      font-size: 18px;
      font-weight: 900;
      color: #f59e0b;
    }
    .combo-val {
      font-size: 16px;
      font-weight: 900;
      color: #10b981;
    }

    /* 遊戲 Canvas 區域 */
    #game-container {
      flex: 1;
      position: relative;
      width: 100%;
      background: linear-gradient(to bottom, #090d16 0%, #111827 70%, #1e1b4b 100%);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 琴鍵控制列 */
    #controls-bar {
      background: #0f172a;
      border-top: 2px solid #eab308;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
      z-index: 10;
    }
    .control-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    /* 鋼琴鍵盤區域 */
    #piano-container {
      height: 170px;
      background: #000;
      position: relative;
      width: 100%;
      display: flex;
      user-select: none;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    .white-key {
      flex: 1;
      background: linear-gradient(to bottom, #f8fafc 0%, #e2e8f0 100%);
      border: 1px solid #94a3b8;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 8px;
      box-shadow: inset 0 -5px 10px rgba(0,0,0,0.15);
      z-index: 1;
    }
    .white-key.active {
      background: linear-gradient(to bottom, #cbd5e1 0%, #38bdf8 100%);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
      transform: translateY(2px);
    }
    .black-key {
      position: absolute;
      width: 7%;
      height: 60%;
      background: linear-gradient(to bottom, #334155 0%, #0f172a 100%);
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
      cursor: pointer;
      z-index: 2;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.6);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }
    .black-key.active {
      background: linear-gradient(to bottom, #0f172a 0%, #0284c7 100%);
      height: 58%;
    }
    .key-label {
      font-size: 11px;
      font-weight: 800;
      color: #475569;
      pointer-events: none;
    }
    .black-key .key-label {
      color: #94a3b8;
      font-size: 9px;
    }

    /* Modal 彈窗樣式 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      color: #f8fafc;
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      color: #60a5fa;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .form-control {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    .form-control:focus {
      border-color: #3b82f6;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      transition: all 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-secondary {
      background: #334155;
      box-shadow: none;
      margin-top: 8px;
    }

    /* 排行榜列表 */
    .leaderboard-list {
      list-style: none;
      margin: 12px 0;
      max-height: 220px;
      overflow-y: auto;
    }
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .leaderboard-rank {
      font-weight: 900;
      width: 24px;
      color: #f59e0b;
    }
    .leaderboard-name {
      flex: 1;
      font-weight: bold;
      margin-left: 8px;
    }
    .leaderboard-score {
      font-weight: 900;
      color: #10b981;
    }
  </style>
</head>
<body>

  <!-- 頂部狀態欄 -->
  <div id="header">
    <div class="header-group">
      <button class="icon-btn" id="btn-pause" title="暫停">⏸</button>
      <button class="icon-btn" id="btn-settings" title="設定">⚙️</button>
      <button class="icon-btn" id="btn-leaderboard" title="排行榜">🏆</button>
      <div class="hearts" id="hearts-container">
        <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
      </div>
    </div>

    <div class="header-group">
      <div class="mode-badge" id="clef-badge">🎼 高音譜號</div>
      <div class="mode-info" id="range-badge">C4 - C5 (單八度)</div>
    </div>

    <div class="header-group">
      <div class="score-box">
        <div class="score-title">MIDI 連接</div>
        <div style="font-size: 11px; font-weight: bold; color: #10b981;" id="midi-status">⚡ 內建鍵盤</div>
      </div>
      <div class="score-box">
        <div class="score-title">SCORE</div>
        <div class="score-val" id="score-text">0</div>
      </div>
      <div class="score-box">
        <div class="score-title">COMBO</div>
        <div class="combo-val" id="combo-text">0</div>
      </div>
    </div>
  </div>

  <!-- 遊戲 Canvas 畫面 -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- 控制列 -->
  <div id="controls-bar">
    <div class="control-item">
      <span>⌨️ 琴鍵範圍：</span>
      <select id="select-range">
        <option value="C4-C5" selected>C4 - C5 (單八度)</option>
        <option value="C3-C4">C3 - C4 (低音單八度)</option>
        <option value="C4-C6">C4 - C6 (雙八度)</option>
      </select>
    </div>
    <div class="control-item">
      <span>🏷️ 琴鍵標籤：</span>
      <select id="select-label">
        <option value="CDEFGAB" selected>CDEFGAB</option>
        <option value="DOREMI">DoReMi</option>
        <option value="NONE">隱藏</option>
      </select>
    </div>
    <div class="control-item">
      <span>🎼 譜號：</span>
      <select id="select-clef">
        <option value="treble" selected>高音譜號</option>
        <option value="bass">低音譜號</option>
      </select>
    </div>
  </div>

  <!-- 虛擬鋼琴 -->
  <div id="piano-container"></div>

  <!-- 開始遊戲 / 名稱輸入彈窗 -->
  <div class="modal active" id="modal-start">
    <div class="modal-content">
      <div class="modal-title">🏰 音符大作戰</div>
      <p style="text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px;">保護城堡！彈奏正確的音符擊退進攻的音樂怪獸！</p>
      
      <div class="form-group">
        <label for="player-name-input">請輸入你的名字：</label>
        <input type="text" id="player-name-input" class="form-control" value="音符騎士" maxlength="12" placeholder="請輸入名字...">
      </div>

      <button class="btn" id="btn-start-game">🚀 開始遊戲</button>
    </div>
  </div>

  <!-- 排行榜彈窗 -->
  <div class="modal" id="modal-leaderboard">
    <div class="modal-content">
      <div class="modal-title">🏆 英雄排行榜</div>
      <ul class="leaderboard-list" id="leaderboard-items">
        <!-- 排行榜動態插入 -->
      </ul>
      <button class="btn btn-secondary" id="btn-close-leaderboard">關閉</button>
    </div>
  </div>

  <!-- 遊戲結束彈窗 -->
  <div class="modal" id="modal-gameover">
    <div class="modal-content">
      <div class="modal-title" style="color:#ef4444;">💥 城堡失守！</div>
      <p style="text-align: center; font-size: 16px; margin-bottom: 12px;">最終得分：<span id="final-score" style="color:#f59e0b; font-weight:900; font-size:22px;">0</span></p>
      <p style="text-align: center; font-size: 14px; color:#10b981; margin-bottom: 20px;">最大連擊：<span id="final-combo">0</span> Combo</p>
      <button class="btn" id="btn-restart">🔄 再試一次</button>
      <button class="btn btn-secondary" id="btn-gameover-leaderboard">🏆 查看排行榜</button>
    </div>
  </div>

  <!-- 設定彈窗 -->
  <div class="modal" id="modal-settings">
    <div class="modal-content">
      <div class="modal-title">⚙️ 遊戲設定</div>
      <div class="form-group">
        <label>主音量：</label>
        <input type="range" id="setting-volume" min="0" max="100" value="80" style="width:100%;">
      </div>
      <div class="form-group">
        <label>怪物移動速度：</label>
        <select id="setting-speed" class="form-control">
          <option value="1">慢速 (適合初學者)</option>
          <option value="1.5" selected>標準速度</option>
          <option value="2.2">快速 (挑戰極限)</option>
        </select>
      </div>
      <button class="btn" id="btn-save-settings">儲存並關閉</button>
    </div>
  </div>

  <script>
    // --- 音符資料庫與樂理定義 ---
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const DOREMI_NAMES = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];

    // 高音譜號 C4 到 G5 偏移量（以 C4 為 0）
    const TREBLE_PITCH_MAP = {
      'C4': 0, 'D4': 1, 'E4': 2, 'F4': 3, 'G4': 4, 'A4': 5, 'B4': 6,
      'C5': 7, 'D5': 8, 'E5': 9, 'F5': 10, 'G5': 11, 'A5': 12, 'B5': 13, 'C6': 14
    };

    // 低音譜號 C2 到 C4 偏移量（以 C2 為 0）
    const BASS_PITCH_MAP = {
      'C2': 0, 'D2': 1, 'E2': 2, 'F2': 3, 'G2': 4, 'A2': 5, 'B2': 6,
      'C3': 7, 'D3': 8, 'E3': 9, 'F3': 10, 'G3': 11, 'A3': 12, 'B3': 13, 'C4': 14
    };

    // MIDI 編號轉音名
    function midiToNoteName(midi) {
      const name = NOTE_NAMES[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return name + octave;
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    // --- 音效合成器 (Web Audio API) ---
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.volume = 0.8;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playNote(midi) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(midiToFreq(midi), this.ctx.currentTime);

        gain.gain.setValueAtTime(this.volume * 0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 1.2);
      }
      playHit() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, this.ctx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(this.volume * 0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
      playMiss() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(this.volume * 0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }
    }

    const audio = new AudioEngine();

    // --- 遊戲狀態與變數 ---
    let playerName = "音符騎士";
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let hp = 5;
    let isPaused = false;
    let isGameOver = false;
    let gameStarted = false;
    let speedMultiplier = 1.5;

    let currentClef = 'treble'; // treble / bass
    let currentRange = 'C4-C5';
    let currentLabelMode = 'CDEFGAB';

    let monsters = [];
    let magicProjectiles = [];
    let spawnTimer = 0;

    // --- Canvas & 繪圖相關 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const container = document.getElementById('game-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // 音符怪物件
    class NoteMonster {
      constructor(midi, noteName, clef) {
        this.midi = midi;
        this.noteName = noteName;
        this.clef = clef;
        this.x = canvas.width + 80;
        this.y = canvas.height - 180;
        this.width = 110;
        this.height = 150;
        this.speed = (1.2 + Math.random() * 0.4) * speedMultiplier;
        this.bounce = Math.random() * Math.PI * 2;
      }

      update() {
        this.x -= this.speed;
        this.bounce += 0.08;
      }

      draw() {
        const floatY = Math.sin(this.bounce) * 6;
        const cardX = this.x;
        const cardY = this.y + floatY;

        ctx.save();

        // 1. 繪製卡片邊框與陰影
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 6;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(cardX - this.width/2, cardY - this.height/2, this.width, this.height, 14);
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. 繪製卡片內的五線譜與音符
        this.drawStaffAndNote(cardX, cardY - 10);

        // 3. 底部紫色小怪物
        const monsterY = cardY + this.height/2 + 10;
        ctx.fillStyle = '#8b5cf6';
        ctx.beginPath();
        ctx.arc(cardX, monsterY, 20, 0, Math.PI * 2);
        ctx.fill();

        // 大眼睛
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cardX - 7, monsterY - 3, 6, 0, Math.PI * 2);
        ctx.arc(cardX + 7, monsterY - 3, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(cardX - 5, monsterY - 3, 3, 0, Math.PI * 2);
        ctx.arc(cardX + 5, monsterY - 3, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawStaffAndNote(cx, cy) {
        const lineSpacing = 9;
        const staffTop = cy - (lineSpacing * 2);

        // 繪製 5 條平行的五線譜線
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 5; i++) {
          const ly = staffTop + i * lineSpacing;
          ctx.beginPath();
          ctx.moveTo(cx - 38, ly);
          ctx.lineTo(cx + 38, ly);
          ctx.stroke();
        }

        // 放大一倍繪製譜號 (Scale 2x)
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 36px serif'; // 放大兩倍
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (this.clef === 'treble') {
          ctx.fillText('𝄞', cx - 24, cy + 2);
        } else {
          ctx.fillText('𝄢', cx - 24, cy - 2);
        }

        // --- 精準符桿方向計算 (關鍵樂理規則) ---
        // 高音譜號：B4(MIDI 71, 中間線) 及以上 -> 符桿朝下(左側)
        // 低音譜號：D3(MIDI 50, 中間線) 及以上 -> 符桿朝下(左側)
        let middleLineMidi = (this.clef === 'treble') ? 71 : 50;
        let baseMidi = (this.clef === 'treble') ? 60 : 36; // C4 或 C2

        // 計算相對於最底下線的步數
        let noteOffset = 0;
        if (this.clef === 'treble') {
          noteOffset = TREBLE_PITCH_MAP[this.noteName] !== undefined ? TREBLE_PITCH_MAP[this.noteName] : 0;
        } else {
          noteOffset = BASS_PITCH_MAP[this.noteName] !== undefined ? BASS_PITCH_MAP[this.noteName] : 0;
        }

        // 高音譜號第一線 (E4) 的 index 為 2 (C4=0, D4=1, E4=2)
        // 低音譜號第一線 (G2) 的 index 為 4 (C2=0, D2=1, E2=2, F2=3, G2=4)
        const bottomLineIndex = (this.clef === 'treble') ? 2 : 4;
        const stepsFromBottomLine = noteOffset - bottomLineIndex;

        // 計算音符 Y 座標
        const bottomLineY = staffTop + 4 * lineSpacing;
        const noteY = bottomLineY - (stepsFromBottomLine * (lineSpacing / 2));
        const noteX = cx + 8;

        // 判斷符桿方向：中間線及以上 (stemDown = true)
        const stemDown = (this.midi >= middleLineMidi);

        // 繪製加線 (Ledger Lines)
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1.5;
        // 下加線 (例：C4)
        if (stepsFromBottomLine < 0) {
          for (let s = -2; s >= stepsFromBottomLine; s -= 2) {
            const ly = bottomLineY - (s * (lineSpacing / 2));
            ctx.beginPath();
            ctx.moveTo(noteX - 10, ly);
            ctx.lineTo(noteX + 10, ly);
            ctx.stroke();
          }
        }
        // 上加線 (例：A5)
        if (stepsFromBottomLine > 8) {
          for (let s = 10; s <= stepsFromBottomLine; s += 2) {
            const ly = bottomLineY - (s * (lineSpacing / 2));
            ctx.beginPath();
            ctx.moveTo(noteX - 10, ly);
            ctx.lineTo(noteX + 10, ly);
            ctx.stroke();
          }
        }

        // 繪製符頭 (Note Head - 傾斜橢圓)
        ctx.save();
        ctx.translate(noteX, noteY);
        ctx.rotate(-0.25);
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(0, 0, 6.5, 4.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 繪製符桿 (Note Stem)
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (stemDown) {
          // 符桿朝下：接在符頭左邊 (noteX - 5.5)
          ctx.moveTo(noteX - 5.5, noteY);
          ctx.lineTo(noteX - 5.5, noteY + 28);
        } else {
          // 符桿朝上：接在符頭右邊 (noteX + 5.5)
          ctx.moveTo(noteX + 5.5, noteY);
          ctx.lineTo(noteX + 5.5, noteY - 28);
        }
        ctx.stroke();
      }
    }

    // 魔法彈特效
    class MagicProjectile {
      constructor(targetX, targetY) {
        this.x = 130;
        this.y = canvas.height - 210;
        this.targetX = targetX;
        this.targetY = targetY;
        this.progress = 0;
        this.speed = 0.08;
      }
      update() {
        this.progress += this.speed;
        return this.progress >= 1;
      }
      draw() {
        const cx = this.x + (this.targetX - this.x) * this.progress;
        const cy = this.y + (this.targetY - this.y) * this.progress;

        ctx.save();
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#0284c7';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- 城堡與守衛騎士繪製 ---
    function drawCastleAndKnight() {
      const castleX = 30;
      const castleY = canvas.height - 230;

      ctx.save();

      // 城堡主體
      ctx.fillStyle = '#475569';
      ctx.fillRect(castleX, castleY + 60, 100, 100);

      // 城牆垛
      ctx.fillStyle = '#334155';
      for (let i = 0; i < 4; i++) {
        ctx.fillRect(castleX + i * 26, castleY + 45, 18, 20);
      }

      // 藍色屋頂塔樓
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.moveTo(castleX + 15, castleY + 45);
      ctx.lineTo(castleX + 50, castleY - 10);
      ctx.lineTo(castleX + 85, castleY + 45);
      ctx.closePath();
      ctx.fill();

      // 城堡門
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(castleX + 35, castleY + 110, 30, 50);

      // --- 小騎士 ---
      const knightX = castleX + 50;
      const knightY = castleY - 20;

      // 騎士盔甲身體
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(knightX - 12, knightY, 24, 24);

      // 騎士頭盔
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.arc(knightX, knightY - 10, 12, 0, Math.PI * 2);
      ctx.fill();

      // 頭盔羽毛飾品
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(knightX, knightY - 22, 6, 0, Math.PI * 2);
      ctx.fill();

      // 盾牌
      ctx.fillStyle = '#eab308';
      ctx.fillRect(knightX - 18, knightY + 2, 8, 14);

      ctx.restore();
    }

    // --- 遊戲主要迴圈 ---
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 繪製防禦地平線與星空背景
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 70);
      ctx.lineTo(canvas.width, canvas.height - 70);
      ctx.stroke();

      // 2. 繪製城堡與騎士
      drawCastleAndKnight();

      if (gameStarted && !isPaused && !isGameOver) {
        // 生成怪物邏輯
        spawnTimer++;
        if (spawnTimer > 130 / speedMultiplier) {
          spawnMonster();
          spawnTimer = 0;
        }

        // 更新與繪製魔法彈
        for (let i = magicProjectiles.length - 1; i >= 0; i--) {
          const p = magicProjectiles[i];
          if (p.update()) {
            magicProjectiles.splice(i, 1);
          } else {
            p.draw();
          }
        }

        // 更新與繪製音符怪
        for (let i = monsters.length - 1; i >= 0; i--) {
          const m = monsters[i];
          m.update();
          m.draw();

          // 音符怪碰觸城堡扣血
          if (m.x <= 130) {
            monsters.splice(i, 1);
            takeDamage();
          }
        }
      } else {
        // 暫停或未開始時僅繪製怪物
        monsters.forEach(m => m.draw());
      }

      requestAnimationFrame(gameLoop);
    }

    // 生成怪物
    function spawnMonster() {
      let activeNotes = getActiveNotesForRange();
      if (activeNotes.length === 0) return;
      const targetNote = activeNotes[Math.floor(Math.random() * activeNotes.length)];
      monsters.push(new NoteMonster(targetNote.midi, targetNote.name, currentClef));
    }

    // 當前模式下的可用音符列表
    function getActiveNotesForRange() {
      let list = [];
      if (currentClef === 'treble') {
        if (currentRange === 'C4-C5') {
          // C4 到 C5 的自然音 (白鍵)
          [60, 62, 64, 65, 67, 69, 71, 72].forEach(m => list.push({ midi: m, name: midiToNoteName(m) }));
        } else if (currentRange === 'C4-C6') {
          for (let m = 60; m <= 84; m++) {
            if (!NOTE_NAMES[m % 12].includes('#')) {
              list.push({ midi: m, name: midiToNoteName(m) });
            }
          }
        }
      } else {
        // 低音譜號
        if (currentRange === 'C3-C4') {
          [48, 50, 52, 53, 55, 57, 59, 60].forEach(m => list.push({ midi: m, name: midiToNoteName(m) }));
        } else {
          for (let m = 36; m <= 60; m++) {
            if (!NOTE_NAMES[m % 12].includes('#')) {
              list.push({ midi: m, name: midiToNoteName(m) });
            }
          }
        }
      }
      return list;
    }

    // 處理玩家輸入音符（鋼琴點擊或 MIDI）
    function handlePlayNote(midi) {
      if (!gameStarted || isPaused || isGameOver) return;

      audio.playNote(midi);

      // 高亮虛擬鋼琴
      const keyEl = document.querySelector(`[data-midi="${midi}"]`);
      if (keyEl) {
        keyEl.classList.add('active');
        setTimeout(() => keyEl.classList.remove('active'), 200);
      }

      // 檢測是否擊中排在最前面的怪物
      if (monsters.length > 0) {
        // 尋找最靠近城堡的怪物
        let closestIndex = 0;
        let minX = monsters[0].x;
        for (let i = 1; i < monsters.length; i++) {
          if (monsters[i].x < minX) {
            minX = monsters[i].x;
            closestIndex = i;
          }
        }

        const target = monsters[closestIndex];
        if (target.midi === midi) {
          // 擊中成功
          audio.playHit();
          magicProjectiles.push(new MagicProjectile(target.x, target.y));
          monsters.splice(closestIndex, 1);

          score += 10 + combo * 2;
          combo++;
          if (combo > maxCombo) maxCombo = combo;
          updateUI();
        } else {
          // 彈錯
          audio.playMiss();
          combo = 0;
          updateUI();
        }
      }
    }

    // 城堡受傷害
    function takeDamage() {
      audio.playMiss();
      hp--;
      combo = 0;
      updateUI();
      if (hp <= 0) {
        endGame();
      }
    }

    // 更新 UI
    function updateUI() {
      document.getElementById('score-text').innerText = score;
      document.getElementById('combo-text').innerText = combo;

      // 血條渲染
      const heartsContainer = document.getElementById('hearts-container');
      heartsContainer.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const heart = document.createElement('span');
        heart.className = `heart ${i < hp ? '' : 'empty'}`;
        heart.innerText = '❤️';
        heartsContainer.appendChild(heart);
      }
    }

    // --- 虛擬鋼琴渲染 ---
    function renderPiano() {
      const container = document.getElementById('piano-container');
      container.innerHTML = '';

      let notes = getActiveNotesForRange();
      if (notes.length === 0) return;

      const minMidi = notes[0].midi;
      const maxMidi = notes[notes.length - 1].midi;

      // 算出所有的白鍵與黑鍵
      let whiteKeys = [];
      for (let m = minMidi; m <= maxMidi; m++) {
        if (!NOTE_NAMES[m % 12].includes('#')) {
          whiteKeys.push(m);
        }
      }

      const whiteKeyWidthPercent = 100 / whiteKeys.length;

      whiteKeys.forEach((midi, index) => {
        const wKey = document.createElement('div');
        wKey.className = 'white-key';
        wKey.dataset.midi = midi;

        const label = document.createElement('span');
        label.className = 'key-label';
        label.innerText = getLabelForMidi(midi);
        wKey.appendChild(label);

        wKey.addEventListener('mousedown', () => handlePlayNote(midi));
        wKey.addEventListener('touchstart', (e) => {
          e.preventDefault();
          handlePlayNote(midi);
        });

        container.appendChild(wKey);

        // 檢查後面是否有黑鍵
        const nextMidi = midi + 1;
        if (NOTE_NAMES[nextMidi % 12].includes('#') && nextMidi <= maxMidi) {
          const bKey = document.createElement('div');
          bKey.className = 'black-key';
          bKey.dataset.midi = nextMidi;
          bKey.style.left = `${(index + 1) * whiteKeyWidthPercent - 3.5}%`;

          const bLabel = document.createElement('span');
          bLabel.className = 'key-label';
          bLabel.innerText = getLabelForMidi(nextMidi);
          bKey.appendChild(bLabel);

          bKey.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            handlePlayNote(nextMidi);
          });
          bKey.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            handlePlayNote(nextMidi);
          });

          container.appendChild(bKey);
        }
      });
    }

    function getLabelForMidi(midi) {
      if (currentLabelMode === 'NONE') return '';
      const noteIdx = midi % 12;
      const octave = Math.floor(midi / 12) - 1;
      if (currentLabelMode === 'DOREMI') {
        return DOREMI_NAMES[noteIdx];
      }
      return NOTE_NAMES[noteIdx] + octave;
    }

    // --- MIDI 裝置連線支援 (Web MIDI API) ---
    function initMIDI() {
      if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess().then(
          (midiAccess) => {
            const inputs = midiAccess.inputs.values();
            let connected = false;
            for (let input of inputs) {
              connected = true;
              input.onmidimessage = onMIDIMessage;
            }
            if (connected) {
              document.getElementById('midi-status').innerText = '🎹 已連接數碼琴';
            }
          },
          () => {
            document.getElementById('midi-status').innerText = '⚡ 內建鍵盤';
          }
        );
      }
    }

    function onMIDIMessage(event) {
      const [status, note, velocity] = event.data;
      // 144 為 Note On 指令
      if (status === 144 && velocity > 0) {
        handlePlayNote(note);
      }
    }

    // --- 排行榜 LocalStorage 管理 ---
    function getLeaderboard() {
      return JSON.parse(localStorage.getItem('note_defense_leaderboard') || '[]');
    }

    function saveScore(name, scoreVal, comboVal) {
      let list = getLeaderboard();
      list.push({ name, score: scoreVal, combo: comboVal, date: new Date().toLocaleDateString() });
      list.sort((a, b) => b.score - a.score);
      list = list.slice(0, 10); // 只保留前 10 名
      localStorage.setItem('note_defense_leaderboard', JSON.stringify(list));
    }

    function renderLeaderboard() {
      const listEl = document.getElementById('leaderboard-items');
      const list = getLeaderboard();
      listEl.innerHTML = '';

      if (list.length === 0) {
        listEl.innerHTML = '<li style="text-align:center; color:#94a3b8; padding:12px;">尚無紀錄，快來搶佔第一名！</li>';
        return;
      }

      list.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <span class="leaderboard-rank">#${index + 1}</span>
          <span class="leaderboard-name">${item.name}</span>
          <span class="leaderboard-score">${item.score} 分 (${item.combo} Combo)</span>
        `;
        listEl.appendChild(li);
      });
    }

    // --- 遊戲流程控制 ---
    function startGame() {
      playerName = document.getElementById('player-name-input').value.trim() || '音符騎士';
      document.getElementById('modal-start').classList.remove('active');

      score = 0;
      combo = 0;
      maxCombo = 0;
      hp = 5;
      monsters = [];
      magicProjectiles = [];
      gameStarted = true;
      isPaused = false;
      isGameOver = false;

      updateUI();
      renderPiano();
    }

    function endGame() {
      isGameOver = true;
      saveScore(playerName, score, maxCombo);
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-combo').innerText = maxCombo;
      document.getElementById('modal-gameover').classList.add('active');
    }

    // --- 事件監聽與控制連結 ---
    document.getElementById('btn-start-game').addEventListener('click', startGame);

    document.getElementById('btn-restart').addEventListener('click', () => {
      document.getElementById('modal-gameover').classList.remove('active');
      startGame();
    });

    document.getElementById('btn-pause').addEventListener('click', () => {
      if (!gameStarted || isGameOver) return;
      isPaused = !isPaused;
      document.getElementById('btn-pause').innerText = isPaused ? '▶️' : '⏸';
    });

    // 排行榜按鈕
    document.getElementById('btn-leaderboard').addEventListener('click', () => {
      renderLeaderboard();
      document.getElementById('modal-leaderboard').classList.add('active');
    });
    document.getElementById('btn-close-leaderboard').addEventListener('click', () => {
      document.getElementById('modal-leaderboard').classList.remove('active');
    });
    document.getElementById('btn-gameover-leaderboard').addEventListener('click', () => {
      document.getElementById('modal-gameover').classList.remove('active');
      renderLeaderboard();
      document.getElementById('modal-leaderboard').classList.add('active');
    });

    // 設定按鈕
    document.getElementById('btn-settings').addEventListener('click', () => {
      document.getElementById('modal-settings').classList.add('active');
    });
    document.getElementById('btn-save-settings').addEventListener('click', () => {
      audio.volume = parseInt(document.getElementById('setting-volume').value) / 100;
      speedMultiplier = parseFloat(document.getElementById('setting-speed').value);
      document.getElementById('modal-settings').classList.remove('active');
    });

    // 下拉選單連動
    document.getElementById('select-range').addEventListener('change', (e) => {
      currentRange = e.target.value;
      document.getElementById('range-badge').innerText = e.target.options[e.target.selectedIndex].text;
      renderPiano();
    });

    document.getElementById('select-clef').addEventListener('change', (e) => {
      currentClef = e.target.value;
      document.getElementById('clef-badge').innerText = (currentClef === 'treble') ? '🎼 高音譜號' : '𝄢 低音譜號';
      renderPiano();
    });

    document.getElementById('select-label').addEventListener('change', (e) => {
      currentLabelMode = e.target.value;
      renderPiano();
    });

    // 電腦鍵盤快捷鍵 (A, S, D, F, G, H, J, K)
    const KEY_MAP = { 'a': 60, 's': 62, 'd': 64, 'f': 65, 'g': 67, 'h': 69, 'j': 71, 'k': 72 };
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (KEY_MAP[key]) {
        handlePlayNote(KEY_MAP[key]);
      }
    });

    // 初始化執行
    window.onload = () => {
      resizeCanvas();
      renderPiano();
      initMIDI();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
