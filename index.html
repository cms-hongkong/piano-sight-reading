<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>鋼琴視譜冒險 - Sight-Reading Piano Adventure</title>
  <style>
    :root {
      --primary-color: #4a6fa5;
      --accent-color: #ff9f1c;
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.85);
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 100%);
    }

    /* Top HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-bg);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: auto;
    }

    .btn-icon {
      background: #334155;
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-icon:hover {
      background: #475569;
    }

    .lives-container {
      display: flex;
      gap: 4px;
      color: #ef4444;
      font-size: 20px;
    }

    .score-label {
      font-size: 14px;
      color: #94a3b8;
    }

    .score-value {
      font-size: 22px;
      font-weight: bold;
      color: #f59e0b;
    }

    /* Stage / Canvas Area */
    #stage-container {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Piano Section */
    #piano-container {
      position: relative;
      width: 100%;
      height: 200px;
      background: #090d16;
      border-top: 3px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    #piano-bar {
      height: 32px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      color: #cbd5e1;
    }

    #keys-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0 10px 10px 10px;
      overflow-x: auto;
    }

    .piano-key {
      position: relative;
      cursor: pointer;
      border-radius: 0 0 6px 6px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      font-weight: bold;
      font-size: 12px;
      box-shadow: inset 0 -5px 10px rgba(0,0,0,0.15);
      transition: background 0.05s, transform 0.05s;
    }

    .piano-key.white {
      background: linear-gradient(to bottom, #ffffff 0%, #e2e8f0 100%);
      color: #334155;
      border: 1px solid #cbd5e1;
      border-top: none;
      z-index: 1;
    }

    .piano-key.white.active {
      background: #38bdf8;
      color: white;
      transform: translateY(2px);
    }

    .piano-key.black {
      background: linear-gradient(to bottom, #334155 0%, #0f172a 100%);
      color: #f8fafc;
      z-index: 2;
      margin-left: -15px;
      margin-right: -15px;
      border-radius: 0 0 4px 4px;
      height: 60%;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }

    .piano-key.black.active {
      background: #0284c7;
      transform: translateY(2px);
    }

    /* Modal / Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 24px 32px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }

    .modal h2 {
      margin-bottom: 16px;
      color: #f8fafc;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-group select, .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      font-size: 14px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Top HUD -->
    <div id="hud">
      <div class="hud-group">
        <button id="btn-pause" class="btn-icon">⏸</button>
        <button id="btn-settings" class="btn-icon">⚙️</button>
      </div>

      <div class="hud-group">
        <div id="lives-display" class="lives-container">❤️❤️❤️❤️❤️</div>
      </div>

      <div class="hud-group">
        <div>
          <span class="score-label">SCORE: </span>
          <span id="score-display" class="score-value">0</span>
        </div>
      </div>
    </div>

    <!-- Main Stage / Canvas -->
    <div id="stage-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- Piano Input Control -->
    <div id="piano-container">
      <div id="piano-bar">
        <span id="range-info">琴鍵範圍: C4 - C5</span>
        <span id="midi-status">MIDI: 未連接</span>
      </div>
      <div id="keys-wrapper">
        <!-- Piano keys generated via JS -->
      </div>
    </div>

    <!-- Start / Pause / Settings Modal -->
    <div id="modal-overlay" class="overlay">
      <div class="modal">
        <h2 id="modal-title">鋼琴視譜冒險</h2>
        
        <div class="form-group">
          <label for="clef-select">譜號選擇 (Clef)</label>
          <select id="clef-select">
            <option value="treble">高音譜號 (Treble Clef)</option>
            <option value="bass">低音譜號 (Bass Clef)</option>
            <option value="both">雙手混合 (Treble & Bass)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="range-select">音域與難度 (Note Range)</label>
          <select id="range-select">
            <option value="c4_g4">初學者: C4 - G4 (5音)</option>
            <option value="c4_c5" selected>標準: C4 - C5 (單八度)</option>
            <option value="g2_c4">低音: G2 - C4 (低音譜表)</option>
            <option value="c3_c5">進階: C3 - C5 (雙八度)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="speed-select">怪物移動速度 (Speed)</label>
          <select id="speed-select">
            <option value="1">慢速 (Easy)</option>
            <option value="1.5" selected>中速 (Normal)</option>
            <option value="2.2">快速 (Hard)</option>
          </select>
        </div>

        <button id="btn-start" class="btn-primary">開始遊戲</button>
      </div>
    </div>
  </div>

  <script>
    // --- Audio Engine (Web Audio API) ---
    class PianoSynth {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      playNote(freq) {
        if (!this.ctx) return;
        
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 1.2);
      }
    }

    // --- Note Map Data ---
    const NOTE_FREQS = {
      'G2': 98.00, 'A2': 110.00, 'B2': 123.47,
      'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
      'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
      'C5': 523.25
    };

    const NOTE_PITCH_INDEX = {
      'G2': 10, 'A2': 11, 'B2': 12,
      'C3': 13, 'D3': 14, 'E3': 15, 'F3': 16, 'G3': 17, 'A3': 18, 'B3': 19,
      'C4': 20, 'D4': 21, 'E4': 22, 'F4': 23, 'G4': 24, 'A4': 25, 'B4': 26,
      'C5': 27
    };

    // --- Main Game Engine ---
    class Game {
      constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.synth = new PianoSynth();

        this.score = 0;
        this.lives = 5;
        this.isRunning = false;
        this.cards = [];
        this.effects = [];
        this.spawnTimer = 0;

        this.settings = {
          clef: 'treble',
          range: 'c4_c5',
          speed: 1.5
        };

        this.initCanvasSize();
        this.bindEvents();
        this.setupKeyboard();
      }

      initCanvasSize() {
        const container = document.getElementById('stage-container');
        this.canvas.width = container.clientWidth;
        this.canvas.height = container.clientHeight;
      }

      bindEvents() {
        window.addEventListener('resize', () => this.initCanvasSize());

        document.getElementById('btn-start').addEventListener('click', () => {
          this.synth.init();
          this.readSettings();
          this.startGame();
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
          this.togglePause();
        });

        document.getElementById('btn-settings').addEventListener('click', () => {
          this.showModal('遊戲設定');
        });

        this.initMIDI();
      }

      readSettings() {
        this.settings.clef = document.getElementById('clef-select').value;
        this.settings.range = document.getElementById('range-select').value;
        this.settings.speed = parseFloat(document.getElementById('speed-select').value);
        this.setupKeyboard();
      }

      getNotePool() {
        const pools = {
          'c4_g4': ['C4', 'D4', 'E4', 'F4', 'G4'],
          'c4_c5': ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'],
          'g2_c4': ['G2', 'A2', 'B2', 'C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3', 'C4'],
          'c3_c5': ['C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3', 'C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5']
        };
        return pools[this.settings.range] || pools['c4_c5'];
      }

      setupKeyboard() {
        const wrapper = document.getElementById('keys-wrapper');
        wrapper.innerHTML = '';
        const notes = this.getNotePool();

        document.getElementById('range-info').innerText = `琴鍵範圍: ${notes[0]} - ${notes[notes.length - 1]}`;

        notes.forEach(note => {
          const key = document.createElement('div');
          const isAccidental = note.includes('#');
          key.className = `piano-key ${isAccidental ? 'black' : 'white'}`;
          key.innerText = note;
          key.dataset.note = note;

          key.addEventListener('mousedown', () => this.handleKeyPress(note));
          key.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.handleKeyPress(note);
          });

          wrapper.appendChild(key);
        });
      }

      initMIDI() {
        if (navigator.requestMIDIAccess) {
          navigator.requestMIDIAccess().then(
            (midi) => {
              document.getElementById('midi-status').innerText = 'MIDI: 已連接';
              const inputs = midi.inputs.values();
              for (let input of inputs) {
                input.onmidimessage = (msg) => this.handleMIDIMessage(msg);
              }
            },
            () => {
              document.getElementById('midi-status').innerText = 'MIDI: 不支援/未存取';
            }
          );
        }
      }

      handleMIDIMessage(msg) {
        const [command, noteNumber, velocity] = msg.data;
        if (command === 144 && velocity > 0) { // Note ON
          const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
          const noteName = noteNames[noteNumber % 12] + (Math.floor(noteNumber / 12) - 1);
          this.handleKeyPress(noteName);
        }
      }

      handleKeyPress(note) {
        if (!this.isRunning) return;

        // Play Audio
        if (NOTE_FREQS[note]) {
          this.synth.playNote(NOTE_FREQS[note]);
        }

        // Highlight key UI
        const keyEl = document.querySelector(`.piano-key[data-note="${note}"]`);
        if (keyEl) {
          keyEl.classList.add('active');
          setTimeout(() => keyEl.classList.remove('active'), 150);
        }

        // Check Card Collisions
        for (let i = 0; i < this.cards.length; i++) {
          if (this.cards[i].note === note) {
            this.score += 10;
            this.updateHUD();
            this.createHitEffect(this.cards[i].x, this.cards[i].y);
            this.cards.splice(i, 1);
            break;
          }
        }
      }

      createHitEffect(x, y) {
        for (let i = 0; i < 12; i++) {
          this.effects.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1.0,
            color: `hsl(${Math.random() * 360}, 100%, 70%)`
          });
        }
      }

      spawnCard() {
        const pool = this.getNotePool();
        const note = pool[Math.floor(Math.random() * pool.length)];

        let clef = this.settings.clef;
        if (clef === 'both') {
          clef = Math.random() > 0.5 ? 'treble' : 'bass';
        }

        this.cards.push({
          x: this.canvas.width + 80,
          y: this.canvas.height * 0.45,
          note: note,
          clef: clef,
          speed: this.settings.speed * 1.5,
          isBoss: Math.random() < 0.1
        });
      }

      startGame() {
        this.score = 0;
        this.lives = 5;
        this.cards = [];
        this.effects = [];
        this.isRunning = true;
        this.updateHUD();
        document.getElementById('modal-overlay').classList.add('hidden');
        requestAnimationFrame(() => this.loop());
      }

      togglePause() {
        this.isRunning = !this.isRunning;
        if (!this.isRunning) {
          this.showModal('遊戲暫停');
        } else {
          document.getElementById('modal-overlay').classList.add('hidden');
          requestAnimationFrame(() => this.loop());
        }
      }

      showModal(title) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-overlay').classList.remove('hidden');
      }

      updateHUD() {
        document.getElementById('score-display').innerText = this.score;
        document.getElementById('lives-display').innerText = '❤️'.repeat(Math.max(0, this.lives));
      }

      loop() {
        if (!this.isRunning) return;

        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw Hero & Castle Area
        this.drawCastleAndHero();

        // Spawn logic
        this.spawnTimer++;
        if (this.spawnTimer > 120 / this.settings.speed) {
          this.spawnCard();
          this.spawnTimer = 0;
        }

        // Update & Draw Cards
        for (let i = this.cards.length - 1; i >= 0; i--) {
          const card = this.cards[i];
          card.x -= card.speed;

          this.drawStaffCard(card);

          // Reach castle line
          if (card.x < 140) {
            this.lives--;
            this.updateHUD();
            this.cards.splice(i, 1);

            if (this.lives <= 0) {
              this.isRunning = false;
              this.showModal('遊戲結束！最終得分: ' + this.score);
              return;
            }
          }
        }

        // Update & Draw Particle Effects
        for (let i = this.effects.length - 1; i >= 0; i--) {
          const p = this.effects[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.03;

          if (p.life <= 0) {
            this.effects.splice(i, 1);
          } else {
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = p.life;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.globalAlpha = 1.0;
          }
        }

        requestAnimationFrame(() => this.loop());
      }

      drawCastleAndHero() {
        const h = this.canvas.height;

        // Castle Base
        this.ctx.fillStyle = '#334155';
        this.ctx.fillRect(20, h * 0.35, 90, h * 0.35);

        // Hero Knight Symbol
        this.ctx.fillStyle = '#38bdf8';
        this.ctx.beginPath();
        this.ctx.arc(65, h * 0.35 - 25, 20, 0, Math.PI * 2);
        this.ctx.fill();

        // Sword Icon
        this.ctx.strokeStyle = '#f59e0b';
        this.ctx.lineWidth = 3;
        this.ctx.beginPath();
        this.ctx.moveTo(85, h * 0.35 - 35);
        this.ctx.lineTo(105, h * 0.35 - 55);
        this.ctx.stroke();
      }

      drawStaffCard(card) {
        const w = 110;
        const h = 140;
        const x = card.x - w / 2;
        const y = card.y - h / 2;

        // Card Container
        this.ctx.fillStyle = '#ffffff';
        this.ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        this.ctx.shadowBlur = 10;
        this.ctx.beginPath();
        this.ctx.roundRect(x, y, w, h, 12);
        this.ctx.fill();
        this.ctx.shadowBlur = 0;

        // Staff Lines (5 lines)
        this.ctx.strokeStyle = '#1e293b';
        this.ctx.lineWidth = 1.5;
        const staffTop = y + 40;
        const lineSpacing = 12;

        for (let i = 0; i < 5; i++) {
          const lineY = staffTop + i * lineSpacing;
          this.ctx.beginPath();
          this.ctx.moveTo(x + 10, lineY);
          this.ctx.lineTo(x + w - 10, lineY);
          this.ctx.stroke();
        }

        // Clef Label
        this.ctx.fillStyle = '#0f172a';
        this.ctx.font = 'bold 22px serif';
        const clefSymbol = card.clef === 'treble' ? '🎼' : '𝄢';
        this.ctx.fillText(clefSymbol, x + 15, staffTop + 34);

        // Note Head Position Calculation
        const pitchIndex = NOTE_PITCH_INDEX[card.note] || 20;
        const baseIndex = card.clef === 'treble' ? 20 : 14; // C4 vs E3 reference base
        const stepOffset = pitchIndex - baseIndex;

        const noteY = staffTop + 48 - (stepOffset * (lineSpacing / 2));
        const noteX = x + w / 2 + 10;

        // Draw Ledger Lines if needed
        if (stepOffset <= 0 || stepOffset >= 12) {
          this.ctx.strokeStyle = '#334155';
          this.ctx.lineWidth = 1.5;
          this.ctx.beginPath();
          this.ctx.moveTo(noteX - 12, noteY);
          this.ctx.lineTo(noteX + 12, noteY);
          this.ctx.stroke();
        }

        // Note Head (Filled Oval)
        this.ctx.fillStyle = '#0f172a';
        this.ctx.beginPath();
        this.ctx.ellipse(noteX, noteY, 6, 4.5, -Math.PI / 12, 0, Math.PI * 2);
        this.ctx.fill();

        // Note Stem
        this.ctx.beginPath();
        this.ctx.moveTo(noteX + 5, noteY);
        this.ctx.lineTo(noteX + 5, noteY - 25);
        this.ctx.stroke();
      }
    }

    // Launch Game instance on load
    window.addEventListener('load', () => {
      new Game();
    });
  </script>
</body>
</html>
