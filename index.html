<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鋼琴視譜冒險 - Sight-Reading Piano Adventure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 鋼琴鍵盤樣式 */
        .piano-wrapper {
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
            background: #0f172a;
        }

        .white-key {
            background: linear-gradient(to bottom, #ffffff 0%, #f1f5f9 80%, #e2e8f0 100%);
            border: 1px solid #cbd5e1;
            border-bottom: 6px solid #94a3b8;
            border-radius: 0 0 8px 8px;
            transition: background 0.05s, transform 0.05s;
            cursor: pointer;
        }
        .white-key:active, .white-key.active {
            background: linear-gradient(to bottom, #38bdf8 0%, #0284c7 100%) !important;
            border-bottom-width: 2px;
            transform: translateY(4px);
            color: white !important;
        }
        .white-key.correct {
            background: linear-gradient(to bottom, #4ade80 0%, #16a34a 100%) !important;
        }
        .white-key.wrong {
            background: linear-gradient(to bottom, #f87171 0%, #dc2626 100%) !important;
        }

        .black-key {
            background: linear-gradient(to bottom, #334155 0%, #020617 100%);
            border: 1px solid #020617;
            border-bottom: 5px solid #020617;
            border-radius: 0 0 5px 5px;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.6);
            transition: background 0.05s, transform 0.05s;
            cursor: pointer;
            z-index: 10;
        }
        .black-key:active, .black-key.active {
            background: linear-gradient(to bottom, #0284c7 0%, #0369a1 100%) !important;
            border-bottom-width: 1px;
            transform: translateY(3px);
        }
        .black-key.correct {
            background: linear-gradient(to bottom, #22c55e 0%, #15803d 100%) !important;
        }
        .black-key.wrong {
            background: linear-gradient(to bottom, #ef4444 0%, #991b1b 100%) !important;
        }

        /* Float Animations */
        @keyframes floatHero {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-hero {
            animation: floatHero 2.8s ease-in-out infinite;
        }

        /* Note Cards */
        .note-card-svg {
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.35));
            will-change: transform;
        }

        .modal-bg {
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden select-none">

    <!-- Top HUD Status Bar -->
    <header class="w-full bg-slate-900/90 backdrop-blur-md px-4 py-2.5 flex items-center justify-between border-b border-slate-800 z-30">
        <div class="flex items-center gap-3">
            <button id="btn-pause" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 flex items-center justify-center text-amber-400 border border-slate-700 transition shadow">
                <i class="fa-solid fa-pause text-lg"></i>
            </button>
            <button id="btn-settings" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 flex items-center justify-center text-slate-300 border border-slate-700 transition shadow">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
            
            <!-- Hearts Lives -->
            <div id="lives-container" class="flex gap-1 ml-2 text-xl text-rose-500 drop-shadow-[0_0_8px_rgba(244,63,94,0.6)]">
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>

        <!-- Clef Badge & Score Progress -->
        <div class="flex flex-col items-center max-w-xs w-full px-2">
            <div class="flex items-center gap-2 mb-1">
                <span id="clef-badge" class="px-3 py-0.5 text-xs font-black bg-amber-400 text-slate-950 rounded-full shadow">🎼 高音譜號</span>
                <span id="range-badge" class="text-xs font-bold text-sky-300">C4 - C5 (單八度)</span>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700">
                <div id="progress-bar" class="bg-gradient-to-r from-amber-400 via-emerald-400 to-teal-300 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Combo & Score & MIDI -->
        <div class="flex items-center gap-4">
            <div id="midi-status" class="hidden lg:flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700">
                <i class="fa-solid fa-plug text-slate-500"></i> <span id="midi-text">MIDI 未連線</span>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-slate-400 font-extrabold tracking-wider">SCORE</div>
                <div id="score-text" class="text-2xl font-black text-amber-400 leading-none">0</div>
            </div>
            <div class="text-right bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
                <div class="text-[9px] text-emerald-400 font-black tracking-wider">COMBO</div>
                <div id="combo-text" class="text-xl font-black text-emerald-400 leading-none">0</div>
            </div>
        </div>
    </header>

    <!-- Main Game Scene -->
    <main class="relative flex-1 w-full overflow-hidden flex flex-col justify-end">
        
        <!-- Background: Exact Starry Sky + Mountains matching uploaded reference -->
        <div class="absolute inset-0 z-0 pointer-events-none bg-gradient-to-b from-[#090d21] via-[#101b42] to-[#1e1b4b]">
            <!-- Stars Canvas -->
            <canvas id="bgCanvas" class="absolute inset-0 w-full h-full"></canvas>

            <!-- Distant Mountains SVG -->
            <svg class="absolute bottom-0 w-full h-2/3 pointer-events-none" preserveAspectRatio="none" viewBox="0 0 1200 400">
                <path d="M 0 400 L 0 260 Q 200 180 400 240 Q 600 300 800 210 Q 1000 160 1200 230 L 1200 400 Z" fill="#1e1b4e" opacity="0.75" />
                <path d="M 0 400 L 0 290 Q 300 220 600 270 Q 900 320 1200 250 L 1200 400 Z" fill="#181338" opacity="0.9" />
                <path d="M 0 400 L 0 330 Q 250 290 500 320 Q 750 350 1200 300 L 1200 400 Z" fill="#0f0c24" />
            </svg>
        </div>

        <!-- Magic FX Canvas -->
        <canvas id="fxCanvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none"></canvas>

        <!-- Moving Note Cards Container -->
        <div id="cards-container" class="absolute inset-0 z-10 pointer-events-none overflow-hidden"></div>

        <!-- Left Side: Music Knight + Music Castle matching uploaded Image Assets -->
        <div class="absolute left-4 bottom-2 z-20 flex flex-col items-center pointer-events-none">
            <!-- Hero Dialogue Bubble -->
            <div id="hero-dialog" class="opacity-0 transition-all duration-300 mb-2 bg-slate-900/95 text-amber-300 text-xs font-black py-1.5 px-3.5 rounded-2xl shadow-2xl relative border-2 border-amber-400/80 transform translate-y-2">
                彈奏琴鍵發射劍氣擊退音符怪！
            </div>
            
            <!-- Character: Music Knight Hero (Ref: Image_17/12) -->
            <div id="hero-character" class="relative animate-hero flex flex-col items-center mb-[-12px] z-10">
                <svg width="120" height="140" viewBox="0 0 120 140" class="drop-shadow-[0_10px_15px_rgba(0,0,0,0.6)]">
                    <!-- Silver Armor Helmet with "C" Mark -->
                    <path d="M 30 50 C 30 15, 90 15, 90 50 L 90 65 L 30 65 Z" fill="#94a3b8" stroke="#334155" stroke-width="3" />
                    <path d="M 35 48 C 35 22, 85 22, 85 48 Z" fill="#cbd5e1" />
                    <path d="M 25 50 Q 60 40 95 50 L 90 62 Q 60 55 30 62 Z" fill="#e2e8f0" stroke="#f59e0b" stroke-width="2" />
                    <!-- "C" Logo on Helmet -->
                    <text x="54" y="38" font-size="20" font-weight="900" fill="#f59e0b" font-family="sans-serif">C</text>

                    <!-- Cute Face & Big Eyes -->
                    <circle cx="60" cy="66" r="22" fill="#fde047" opacity="0.2" />
                    <circle cx="60" cy="66" r="20" fill="#fef08a" />
                    <ellipse cx="50" cy="64" rx="4" ry="6" fill="#1e293b" />
                    <ellipse cx="70" cy="64" rx="4" ry="6" fill="#1e293b" />
                    <circle cx="51" cy="62" r="1.5" fill="#ffffff" />
                    <circle cx="71" cy="62" r="1.5" fill="#ffffff" />
                    <path d="M 56 74 Q 60 78 64 74" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" />

                    <!-- Armor Body & Gold Trim -->
                    <path d="M 35 80 L 85 80 L 92 130 L 28 130 Z" fill="#3b82f6" />
                    <path d="M 42 80 L 78 80 L 85 130 L 35 130 Z" fill="#2563eb" />
                    <rect x="42" y="80" width="36" height="30" rx="4" fill="#cbd5e1" stroke="#f59e0b" stroke-width="2" />
                    <!-- Shield with Music Note (Ref: Image_17) -->
                    <g transform="translate(10, 80)">
                        <path d="M 0 0 L 26 0 Q 28 25 13 38 Q -2 25 0 0 Z" fill="#2563eb" stroke="#f59e0b" stroke-width="2.5" />
                        <text x="6" y="24" font-size="16" fill="#f59e0b">🎵</text>
                    </g>
                    <!-- Treble Clef Sword (Ref: Image_17) -->
                    <g transform="translate(82, 50)">
                        <line x1="10" y1="10" x2="10" y2="75" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
                        <text x="-4" y="45" font-size="34" fill="#f59e0b" font-family="serif">🎼</text>
                    </g>
                </svg>
            </div>

            <!-- Music Castle Base (Ref: Image_15/10) -->
            <div class="w-36 h-36 relative flex flex-col items-center drop-shadow-2xl">
                <svg width="140" height="140" viewBox="0 0 140 140">
                    <!-- Blue Roof Towers -->
                    <polygon points="15,45 35,10 55,45" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
                    <polygon points="85,45 105,10 125,45" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
                    <polygon points="45,35 70,0 95,35" fill="#1d4ed8" stroke="#1e40af" stroke-width="2" />
                    <!-- Music Flags -->
                    <line x1="70" y1="0" x2="70" y2="-12" stroke="#f59e0b" stroke-width="2" />
                    <polygon points="70,-12 88,-7 70,-2" fill="#38bdf8" />

                    <!-- Castle Main Wall & Windows -->
                    <rect x="20" y="45" width="100" height="90" fill="#e2e8f0" rx="4" stroke="#94a3b8" stroke-width="3" />
                    <!-- Glowing Windows -->
                    <rect x="35" y="60" width="14" height="20" rx="7" fill="#fef08a" stroke="#f59e0b" stroke-width="2" />
                    <rect x="91" y="60" width="14" height="20" rx="7" fill="#fef08a" stroke="#f59e0b" stroke-width="2" />
                    <rect x="63" y="48" width="14" height="22" rx="7" fill="#fef08a" stroke="#f59e0b" stroke-width="2" />
                    <!-- Castle Wooden Gate -->
                    <path d="M 52 135 L 52 100 Q 70 88 88 100 L 88 135 Z" fill="#78350f" stroke="#451a03" stroke-width="3" />
                </svg>
            </div>
        </div>
    </main>

    <!-- Bottom: Piano Keyboard Footer -->
    <footer class="w-full piano-wrapper p-2 flex flex-col items-center border-t-4 border-amber-500 relative z-20">
        <div class="w-full max-w-6xl flex justify-between items-center mb-1 px-3 text-xs text-slate-300">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-keyboard text-amber-400"></i>
                <span class="font-bold text-slate-300">琴鍵範圍：<span id="active-key-range-text" class="text-amber-400 font-extrabold">C4 - C5</span></span>
            </div>
            <div class="flex items-center gap-3">
                <label for="toggle-labels" class="cursor-pointer font-bold">琴鍵標籤：</label>
                <select id="toggle-labels" class="bg-slate-800 text-amber-300 font-extrabold border border-slate-700 rounded-lg px-2.5 py-1 focus:outline-none focus:border-amber-400">
                    <option value="cde">C D E F G A B</option>
                    <option value="solfège">Do Re Mi Fa Sol La Ti</option>
                    <option value="keyboard">顯示電腦按鍵</option>
                    <option value="none">隱藏標籤</option>
                </select>
            </div>
        </div>

        <!-- Dynamic Piano Keyboard -->
        <div class="w-full max-w-6xl h-40 md:h-48 relative flex justify-center select-none px-1" id="piano-keyboard">
            <!-- Piano keys rendered dynamically via JS -->
        </div>
    </footer>

    <!-- Modal 1: Start Menu -->
    <div id="modal-start" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg">
        <div class="bg-slate-900 border-2 border-amber-400/80 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl text-center relative overflow-hidden">
            <div class="text-4xl mb-2">🏰⚔️🎹</div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-100 to-amber-400 mb-2">
                鋼琴視譜冒險
            </h1>
            <p class="text-xs text-slate-300 mb-6">彈奏琴鍵擊退音符怪與鼓棒 Boss，守護音樂城堡！</p>

            <div class="space-y-4 text-left mb-8 bg-slate-950/80 p-4 rounded-2xl border border-slate-800">
                <!-- Clef Selection -->
                <div>
                    <label class="block text-xs font-extrabold text-amber-400 mb-2"><i class="fa-solid fa-music mr-1"></i> 選擇譜號 (Clef)</label>
                    <div class="grid grid-cols-3 gap-2" id="start-clef-select">
                        <button data-value="treble" class="clef-btn active bg-amber-400 text-slate-950 font-black py-2 rounded-xl text-xs transition shadow">
                            🎼 高音譜號
                        </button>
                        <button data-value="bass" class="clef-btn bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold py-2 rounded-xl text-xs transition border border-slate-700">
                            𝄢 低音譜號
                        </button>
                        <button data-value="both" class="clef-btn bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold py-2 rounded-xl text-xs transition border border-slate-700">
                            🎶 雙手混合
                        </button>
                    </div>
                </div>

                <!-- Range Selection -->
                <div>
                    <label class="block text-xs font-extrabold text-amber-400 mb-2"><i class="fa-solid fa-sliders mr-1"></i> 練習音域 (對齊琴鍵)</label>
                    <select id="start-range-select" class="w-full bg-slate-800 text-amber-300 font-black border border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:border-amber-400">
                        <option value="beginner">初學入門：C4 - G4 (5個琴鍵)</option>
                        <option value="intermediate" selected>中級標準：C4 - C5 (單八度 8個琴鍵)</option>
                        <option value="bass_range">低音專區：G2 - C4 (低音譜表範圍)</option>
                        <option value="extended">進階挑戰：C3 - C5 (雙八度完整對齊)</option>
                    </select>
                </div>

                <!-- Speed Selection -->
                <div>
                    <label class="block text-xs font-extrabold text-amber-400 mb-2"><i class="fa-solid fa-gauge-high mr-1"></i> 移動速度</label>
                    <div class="grid grid-cols-3 gap-2" id="start-speed-select">
                        <button data-value="1" class="speed-btn bg-slate-800 text-slate-300 font-bold py-1.5 rounded-xl text-xs border border-slate-700">慢速</button>
                        <button data-value="1.5" class="speed-btn active bg-amber-400 text-slate-950 font-black py-1.5 rounded-xl text-xs shadow">標準</button>
                        <button data-value="2.2" class="speed-btn bg-slate-800 text-slate-300 font-bold py-1.5 rounded-xl text-xs border border-slate-700">快速</button>
                    </div>
                </div>
            </div>

            <button id="btn-start-game" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-lg rounded-2xl shadow-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 開始視譜大冒險
            </button>
        </div>
    </div>

    <!-- Modal 2: Pause / Settings -->
    <div id="modal-settings" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg hidden">
        <div class="bg-slate-900 border-2 border-slate-700 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
            <h2 class="text-2xl font-black text-amber-300 mb-4"><i class="fa-solid fa-pause-circle mr-2"></i>遊戲暫停</h2>
            <div class="space-y-4 text-left mb-6 bg-slate-950 p-4 rounded-xl border border-slate-800">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">主音量</label>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7" class="w-full accent-amber-400 cursor-pointer">
                </div>
            </div>
            <div class="flex flex-col gap-2.5">
                <button id="btn-resume" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl transition">繼續遊戲</button>
                <button id="btn-restart" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold rounded-xl transition border border-slate-700">重新開始</button>
                <button id="btn-quit" class="w-full py-2.5 bg-slate-950 hover:bg-slate-900 text-slate-400 font-bold rounded-xl transition border border-slate-800">主選單</button>
            </div>
        </div>
    </div>

    <!-- Modal 3: Game Result -->
    <div id="modal-result" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg hidden">
        <div class="bg-slate-900 border-2 border-amber-400 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl text-center">
            <div id="result-icon" class="text-5xl mb-2">🏆</div>
            <h2 id="result-title" class="text-3xl font-black text-amber-300 mb-1">冒險成功！</h2>
            <p id="result-subtitle" class="text-xs text-slate-300 mb-6">你成功守護了音樂城堡！</p>
            <div class="grid grid-cols-2 gap-3 mb-6 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-left">
                <div>
                    <div class="text-[10px] text-slate-400 font-bold">最終得分</div>
                    <div id="res-score" class="text-2xl font-black text-amber-400">0</div>
                </div>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold">最高 COMBO</div>
                    <div id="res-combo" class="text-2xl font-black text-emerald-400">0</div>
                </div>
            </div>
            <button id="btn-res-replay" class="w-full py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl transition shadow">再次挑戰</button>
        </div>
    </div>

    <!-- Core Game Logic -->
    <script>
        const CHROMATIC_NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const SOLFEGE_NAMES = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Ti"];

        const RANGE_DEFINITIONS = {
            beginner: { startNote: "C4", endNote: "G4", label: "C4 - G4 (五音)" },
            intermediate: { startNote: "C4", endNote: "C5", label: "C4 - C5 (單八度)" },
            bass_range: { startNote: "G2", endNote: "C4", label: "G2 - C4 (低音表)" },
            extended: { startNote: "C3", endNote: "C5", label: "C3 - C5 (雙八度)" }
        };

        const KEYBOARD_KEYS_POOL = ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'q', 'w', 'e', 'r', 't', 'y', 'u'];

        const STAFF_DATA = {
            treble: [
                { note: "C4", offset: -2, clef: "treble" },
                { note: "D4", offset: -1, clef: "treble" },
                { note: "E4", offset: 0,  clef: "treble" },
                { note: "F4", offset: 1,  clef: "treble" },
                { note: "G4", offset: 2,  clef: "treble" },
                { note: "A4", offset: 3,  clef: "treble" },
                { note: "B4", offset: 4,  clef: "treble" },
                { note: "C5", offset: 5,  clef: "treble" }
            ],
            bass: [
                { note: "G2", offset: 0,  clef: "bass" },
                { note: "A2", offset: 1,  clef: "bass" },
                { note: "B2", offset: 2,  clef: "bass" },
                { note: "C3", offset: 3,  clef: "bass" },
                { note: "D3", offset: 4,  clef: "bass" },
                { note: "E3", offset: 5,  clef: "bass" },
                { note: "F3", offset: 6,  clef: "bass" },
                { note: "G3", offset: 7,  clef: "bass" },
                { note: "A3", offset: 8,  clef: "bass" },
                { note: "B3", offset: 9,  clef: "bass" },
                { note: "C4", offset: 10, clef: "bass" }
            ]
        };

        let gameState = {
            status: "menu",
            clef: "treble",
            rangeKey: "intermediate",
            speed: 1.5,
            score: 0,
            combo: 0,
            maxCombo: 0,
            lives: 5,
            maxLives: 5,
            volume: 0.7,
            cards: [],
            particles: [],
            labelType: "cde",
            activeKeyList: [],
            keyBindingMap: {},
            lastSpawnTime: 0,
            spawnInterval: 2500
        };

        // Web Audio Synth
        class WebPianoSynth {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            getFreq(noteStr) {
                const name = noteStr.replace(/[0-9]/g, '');
                const octave = parseInt(noteStr.replace(/[^0-9]/g, ''));
                const semitone = CHROMATIC_NOTES.indexOf(name);
                const midi = (octave + 1) * 12 + semitone;
                return 440 * Math.pow(2, (midi - 69) / 12);
            }
            playNote(noteStr) {
                if (!this.ctx) this.init();
                const freq = this.getFreq(noteStr);
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(gameState.volume * 0.8, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 1.2);
            }
        }
        const audioSynth = new WebPianoSynth();

        function generateNoteSequence(startNoteStr, endNoteStr) {
            const startName = startNoteStr.replace(/[0-9]/g, '');
            const startOct = parseInt(startNoteStr.replace(/[^0-9]/g, ''));
            const endName = endNoteStr.replace(/[0-9]/g, '');
            const endOct = parseInt(endNoteStr.replace(/[^0-9]/g, ''));
            const startMidi = (startOct + 1) * 12 + CHROMATIC_NOTES.indexOf(startName);
            const endMidi = (endOct + 1) * 12 + CHROMATIC_NOTES.indexOf(endName);
            const list = [];
            for (let m = startMidi; m <= endMidi; m++) {
                const octave = Math.floor(m / 12) - 1;
                const name = CHROMATIC_NOTES[m % 12];
                list.push({ note: name + octave, name: name, octave: octave, isBlack: name.includes("#") });
            }
            return list;
        }

        function renderDynamicPiano() {
            const container = document.getElementById('piano-keyboard');
            container.innerHTML = '';
            const rangeConfig = RANGE_DEFINITIONS[gameState.rangeKey];
            gameState.activeKeyList = generateNoteSequence(rangeConfig.startNote, rangeConfig.endNote);
            document.getElementById('active-key-range-text').textContent = rangeConfig.label;

            const whiteKeys = gameState.activeKeyList.filter(k => !k.isBlack);
            const totalWhite = whiteKeys.length;

            gameState.keyBindingMap = {};
            let whiteIdx = 0;
            gameState.activeKeyList.forEach(k => {
                if (!k.isBlack && whiteIdx < KEYBOARD_KEYS_POOL.length) {
                    const char = KEYBOARD_KEYS_POOL[whiteIdx];
                    gameState.keyBindingMap[char] = k.note;
                    k.charLabel = char.toUpperCase();
                    whiteIdx++;
                }
            });

            const whiteLayer = document.createElement('div');
            whiteLayer.className = 'w-full h-full flex relative z-0';
            whiteKeys.forEach(k => {
                const keyEl = document.createElement('div');
                keyEl.className = 'white-key flex-1 h-full flex flex-col justify-end items-center pb-3 select-none relative';
                keyEl.dataset.note = k.note;
                const labelSpan = document.createElement('span');
                labelSpan.className = 'key-label text-xs font-black text-slate-600 pointer-events-none';
                labelSpan.textContent = getKeyLabelText(k);
                keyEl.appendChild(labelSpan);
                bindKeyTouchEvents(keyEl, k.note);
                whiteLayer.appendChild(keyEl);
            });
            container.appendChild(whiteLayer);

            const blackKeys = gameState.activeKeyList.filter(k => k.isBlack);
            blackKeys.forEach(k => {
                const keyEl = document.createElement('div');
                keyEl.className = 'black-key absolute h-[58%] flex flex-col justify-end items-center pb-1 text-[10px] text-slate-300 font-extrabold';
                keyEl.dataset.note = k.note;
                const fullIndex = gameState.activeKeyList.findIndex(item => item.note === k.note);
                const precedingWhites = gameState.activeKeyList.slice(0, fullIndex).filter(item => !item.isBlack).length;
                const keyWidthPercent = 100 / totalWhite * 0.65;
                const leftPercent = (precedingWhites / totalWhite) * 100 - (keyWidthPercent / 2);
                keyEl.style.width = `${keyWidthPercent}%`;
                keyEl.style.left = `${leftPercent}%`;
                const labelSpan = document.createElement('span');
                labelSpan.className = 'key-label pointer-events-none';
                labelSpan.textContent = getKeyLabelText(k);
                keyEl.appendChild(labelSpan);
                bindKeyTouchEvents(keyEl, k.note);
                container.appendChild(keyEl);
            });
        }

        function getKeyLabelText(kData) {
            if (gameState.labelType === 'none') return '';
            if (gameState.labelType === 'keyboard') return kData.charLabel || '';
            const idx = CHROMATIC_NOTES.indexOf(kData.name);
            if (gameState.labelType === 'solfège') return SOLFEGE_NAMES[idx];
            return kData.note;
        }

        function bindKeyTouchEvents(el, noteStr) {
            const handlePress = (e) => {
                e.preventDefault();
                audioSynth.init();
                triggerNotePress(noteStr);
            };
            el.addEventListener('mousedown', handlePress);
            el.addEventListener('touchstart', handlePress, { passive: false });
        }

        function triggerNotePress(noteStr) {
            audioSynth.playNote(noteStr);
            const keyEl = document.querySelector(`[data-note="${noteStr}"]`);
            if (keyEl) {
                keyEl.classList.add('active');
                setTimeout(() => keyEl.classList.remove('active'), 180);
            }
            if (gameState.status === 'playing') checkAnswer(noteStr, keyEl);
        }

        function spawnStaffCard() {
            let candidates = [];
            if (gameState.clef === 'treble' || gameState.clef === 'both') candidates = candidates.concat(STAFF_DATA.treble);
            if (gameState.clef === 'bass' || gameState.clef === 'both') candidates = candidates.concat(STAFF_DATA.bass);

            const activeNotesSet = new Set(gameState.activeKeyList.map(k => k.note));
            candidates = candidates.filter(c => activeNotesSet.has(c.note));

            if (candidates.length === 0) return;
            const selected = candidates[Math.floor(Math.random() * candidates.length)];
            const isBoss = Math.random() < 0.18; // Boss Monster Event (Image_14/9)

            const cardObj = {
                id: 'card-' + Date.now(),
                noteData: selected,
                x: window.innerWidth + 20,
                y: window.innerHeight * 0.3,
                speed: gameState.speed * (isBoss ? 0.8 : 1.1),
                isBoss: isBoss,
                element: null
            };

            const cardDom = createSvgCardElement(cardObj);
            document.getElementById('cards-container').appendChild(cardDom);
            cardObj.element = cardDom;
            gameState.cards.push(cardObj);
        }

        // SVG Card Renderer matching uploaded images (Short ledger lines, exact treble/bass clef)
        function createSvgCardElement(cardObj) {
            const cardDiv = document.createElement('div');
            cardDiv.id = cardObj.id;
            cardDiv.className = 'absolute top-0 left-0 note-card-svg pointer-events-none flex flex-col items-center';
            cardDiv.style.transform = `translate3d(${cardObj.x}px, ${cardObj.y}px, 0)`;

            const isTreble = cardObj.noteData.clef === 'treble';
            const offset = cardObj.noteData.offset;

            const line1Y = 90;
            const lineSpacing = 12;
            const noteY = line1Y - offset * (lineSpacing / 2);

            // Short Precise Ledger Lines
            let ledgerLinesSvg = '';
            if (offset <= -2) {
                for (let o = -2; o >= offset; o -= 2) {
                    const ly = line1Y - o * (lineSpacing / 2);
                    ledgerLinesSvg += `<line x1="52" y1="${ly}" x2="78" y2="${ly}" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>`;
                }
            } else if (offset >= 10) {
                for (let o = 10; o <= offset; o += 2) {
                    const ly = line1Y - o * (lineSpacing / 2);
                    ledgerLinesSvg += `<line x1="52" y1="${ly}" x2="78" y2="${ly}" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>`;
                }
            }

            const stemUp = offset < 4;
            const stemSvg = stemUp
                ? `<line x1="71" y1="${noteY}" x2="71" y2="${noteY - 30}" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>`
                : `<line x1="59" y1="${noteY}" x2="59" y2="${noteY + 30}" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>`;

            // Monster Graphic underneath card (Boss / Normal Note Monster Ref: Image_16/14)
            const monsterSvg = cardObj.isBoss ? `
                <!-- Drumstick Boss Monster (Ref: Image_14) -->
                <g transform="translate(15, 150)">
                    <circle cx="50" cy="25" r="22" fill="#7e22ce" stroke="#f59e0b" stroke-width="2" />
                    <!-- Drumsticks -->
                    <line x1="20" y1="10" x2="35" y2="30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
                    <line x1="80" y1="10" x2="65" y2="30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
                    <!-- Eyes & Horns -->
                    <circle cx="42" cy="22" r="3" fill="#ffffff" />
                    <circle cx="58" cy="22" r="3" fill="#ffffff" />
                    <text x="32" y="-2" font-size="10" font-weight="900" fill="#f59e0b">BOSS</text>
                </g>
            ` : `
                <!-- Note Monster (Ref: Image_16) -->
                <g transform="translate(30, 152)">
                    <circle cx="35" cy="18" r="15" fill="#a855f7" />
                    <circle cx="29" cy="15" r="2.5" fill="#ffffff" />
                    <circle cx="41" cy="15" r="2.5" fill="#ffffff" />
                    <path d="M 35 3 L 35 -6 L 44 -2" stroke="#a855f7" stroke-width="3" fill="none" stroke-linecap="round"/>
                </g>
            `;

            const svgContent = `
                <svg width="130" height="195" viewBox="0 0 130 195" xmlns="http://www.w3.org/2000/svg">
                    <!-- White Card Container -->
                    <rect x="5" y="5" width="120" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>

                    <!-- Staff Lines (5 Lines) -->
                    <line x1="20" y1="42" x2="110" y2="42" stroke="#334155" stroke-width="2"/>
                    <line x1="20" y1="54" x2="110" y2="54" stroke="#334155" stroke-width="2"/>
                    <line x1="20" y1="66" x2="110" y2="66" stroke="#334155" stroke-width="2"/>
                    <line x1="20" y1="78" x2="110" y2="78" stroke="#334155" stroke-width="2"/>
                    <line x1="20" y1="90" x2="110" y2="90" stroke="#334155" stroke-width="2"/>

                    <!-- Exact Treble / Bass Clef (Ref: Image_4/6) -->
                    ${isTreble ? `
                        <text x="22" y="82" font-size="42" font-family="serif" fill="#0f172a">🎼</text>
                    ` : `
                        <text x="22" y="78" font-size="36" font-family="serif" fill="#0f172a">𝄢</text>
                    `}

                    <!-- Ledger Lines & Stem -->
                    ${ledgerLinesSvg}
                    ${stemSvg}

                    <!-- Note Head -->
                    <ellipse cx="65" cy="${noteY}" rx="7" ry="5" transform="rotate(-20, 65, ${noteY})" fill="#0f172a"/>

                    <!-- Monster Footer Attachment -->
                    ${monsterSvg}
                </svg>
            `;

            cardDiv.innerHTML = svgContent;
            return cardDiv;
        }

        function checkAnswer(pressedNote, keyEl) {
            if (gameState.cards.length === 0) return;
            let targetIdx = 0;
            let minX = Infinity;
            gameState.cards.forEach((c, i) => { if (c.x < minX) { minX = c.x; targetIdx = i; } });

            const targetCard = gameState.cards[targetIdx];
            if (targetCard && targetCard.noteData.note === pressedNote) {
                if (keyEl) {
                    keyEl.classList.add('correct');
                    setTimeout(() => keyEl.classList.remove('correct'), 250);
                }
                if (targetCard.element) targetCard.element.remove();
                gameState.cards.splice(targetIdx, 1);

                gameState.combo++;
                if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
                gameState.score += targetCard.isBoss ? 30 : 10;
                updateUI();
            } else {
                if (keyEl) {
                    keyEl.classList.add('wrong');
                    setTimeout(() => keyEl.classList.remove('wrong'), 250);
                }
                gameState.combo = 0;
                updateUI();
            }
        }

        // Starry Night Sky Background Canvas Loop (Ref: Image_13)
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgStars = [];

        function initBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            bgStars = [];
            for (let i = 0; i < 70; i++) {
                bgStars.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height * 0.6,
                    r: Math.random() * 2 + 1,
                    alpha: Math.random()
                });
            }
        }
        window.addEventListener('resize', initBgCanvas);
        initBgCanvas();

        function drawBgStars() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgStars.forEach(s => {
                s.alpha += (Math.random() - 0.5) * 0.02;
                if (s.alpha < 0.2) s.alpha = 0.2;
                if (s.alpha > 1) s.alpha = 1;
                bgCtx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                bgCtx.beginPath();
                bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                bgCtx.fill();
            });
        }

        function gameLoop(timestamp) {
            drawBgStars();

            if (gameState.status === 'playing') {
                if (!gameState.lastSpawnTime) gameState.lastSpawnTime = timestamp;
                if (timestamp - gameState.lastSpawnTime > gameState.spawnInterval / gameState.speed) {
                    spawnStaffCard();
                    gameState.lastSpawnTime = timestamp;
                }

                for (let i = gameState.cards.length - 1; i >= 0; i--) {
                    const card = gameState.cards[i];
                    card.x -= card.speed;
                    if (card.element) card.element.style.transform = `translate3d(${card.x}px, ${card.y}px, 0)`;

                    if (card.x < 130) {
                        if (card.element) card.element.remove();
                        gameState.cards.splice(i, 1);
                        gameState.lives--;
                        gameState.combo = 0;
                        updateUI();
                        if (gameState.lives <= 0) endGame(false);
                    }
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('score-text').textContent = gameState.score;
            document.getElementById('combo-text').textContent = gameState.combo;
            const livesContainer = document.getElementById('lives-container');
            livesContainer.innerHTML = '';
            for (let i = 0; i < gameState.maxLives; i++) {
                const heart = document.createElement('i');
                heart.className = i < gameState.lives ? 'fa-solid fa-heart' : 'fa-regular fa-heart opacity-25';
                livesContainer.appendChild(heart);
            }
            document.getElementById('progress-bar').style.width = `${Math.min(100, (gameState.score / 200) * 100)}%`;
        }

        function startGame() {
            document.getElementById('cards-container').innerHTML = '';
            gameState.cards = [];
            gameState.status = "playing";
            gameState.score = 0;
            gameState.combo = 0;
            gameState.lives = 5;

            document.getElementById('modal-start').classList.add('hidden');
            document.getElementById('modal-settings').classList.add('hidden');
            document.getElementById('modal-result').classList.add('hidden');

            renderDynamicPiano();
            updateUI();
        }

        function endGame(isVictory) {
            gameState.status = "ended";
            document.getElementById('modal-result').classList.remove('hidden');
            document.getElementById('res-score').textContent = gameState.score;
            document.getElementById('res-combo').textContent = gameState.maxCombo;
            if (isVictory && typeof confetti === 'function') confetti({ particleCount: 100 });
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (gameState.keyBindingMap[key]) triggerNotePress(gameState.keyBindingMap[key]);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderDynamicPiano();
            document.getElementById('btn-start-game').addEventListener('click', () => {
                gameState.rangeKey = document.getElementById('start-range-select').value;
                audioSynth.init();
                startGame();
            });
            document.getElementById('btn-pause').addEventListener('click', () => {
                gameState.status = 'paused';
                document.getElementById('modal-settings').classList.remove('hidden');
            });
            document.getElementById('btn-resume').addEventListener('click', () => {
                gameState.status = 'playing';
                document.getElementById('modal-settings').classList.add('hidden');
            });
            document.getElementById('btn-res-replay').addEventListener('click', startGame);

            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
