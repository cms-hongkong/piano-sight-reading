<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>鋼琴視譜冒險 - Sight-Reading Piano Adventure</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 100%);
    }

    /* Top HUD UI */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .hud-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: auto;
    }

    .btn-icon {
      background: #334155;
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: #475569;
      transform: scale(1.05);
    }

    .lives-box {
      font-size: 20px;
      letter-spacing: 2px;
    }

    .score-title {
      font-size: 12px;
      color: #94a3b8;
      margin-right: 4px;
    }

    .score-num {
      font-size: 22px;
      font-weight: 800;
      color: #fbbf24;
    }

    /* Stage Canvas Container */
    #stage-container {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Piano Section */
    #piano-container {
      position: relative;
      width: 100%;
      height: 220px;
      background: #090d16;
      border-top: 3px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    #piano-bar {
      height: 32px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: bold;
    }

    #keys-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0 4px 6px 4px;
      overflow-x: auto;
    }

    .piano-key {
      position: relative;
      cursor: pointer;
      border-radius: 0 0 6px 6px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: inset 0 -4px 8px rgba(0,0,0,0.2);
      transition: background 0.05s, transform 0.05s;
      flex: 1;
      max-width: 50px;
      min-width: 24px;
    }

    .piano-key.white {
      background: linear-gradient(to bottom, #ffffff 0%, #e2e8f0 100%);
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-top: none;
      z-index: 1;
    }

    .piano-key.white.active {
      background: #38bdf8 !important;
      color: #ffffff;
      transform: translateY(3px);
    }

    .piano-key.black {
      background: linear-gradient(to bottom, #334155 0%, #0f172a 100%);
      color: #f8fafc;
      z-index: 2;
      margin-left: -12px;
      margin-right: -12px;
      border-radius: 0 0 4px 4px;
      height: 58%;
      max-width: 30px;
      min-width: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    }

    .piano-key.black.active {
      background: #0284c7 !important;
      transform: translateY(3px);
    }

    /* Modal Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 15, 25, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 24px 28px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }

    .modal h2 {
      margin-bottom: 16px;
      color: #f8fafc;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Top HUD -->
    <div id="hud">
      <div class="hud-panel">
        <button id="btn-pause" class="btn-icon">⏸</button>
        <button id="btn-settings" class="btn-icon">⚙️</button>
      </div>

      <div class="hud-panel">
        <div id="lives-display" class="lives-box">❤️❤️❤️❤️❤️</div>
      </div>

      <div class="hud-panel">
        <div>
          <span class="score-title">SCORE</span>
          <span id="score-display" class="score-num">0</span>
        </div>
      </div>
    </div>

    <!-- Main Stage Canvas -->
    <div id="stage-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- Piano Key Controls -->
    <div id="piano-container">
      <div id="piano-bar">
        <span id="range-info">琴鍵範圍: C4 - C5</span>
        <span id="midi-status">MIDI: 未連接</span>
      </div>
      <div id="keys-wrapper">
        <!-- Piano keys generated dynamically -->
      </div>
    </div>

    <!-- Start & Settings Modal -->
    <div id="modal-overlay" class="overlay">
      <div class="modal">
        <h2 id="modal-title">鋼琴視譜冒險</h2>
        
        <div class="form-group">
          <label for="clef-select">譜號模式 (Clef)</label>
          <select id="clef-select">
            <option value="treble" selected>高音譜號 (Treble Clef)</option>
            <option value="bass">低音譜號 (Bass Clef)</option>
            <option value="both">雙手混合 (Treble & Bass)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="speed-select">怪物速度 (Speed)</label>
          <select id="speed-select">
            <option value="0.7">慢速 (Easy)</option>
            <option value="1.3" selected>中速 (Normal)</option>
            <option value="2.2">快速 (Hard)</option>
          </select>
        </div>

        <button id="btn-start" class="btn-primary">開始遊戲</button>
      </div>
    </div>
  </div>

  <script>
    // --- Audio Synth (Web Audio API) ---
    class PianoSynth {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playNote(freq) {
        if (!this.ctx) return;
        
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 1.2);
      }
    }

    // Comprehensive Frequency Map
    const NOTE_FREQS = {
      'F2': 87.31, 'F#2': 92.50, 'G2': 98.00, 'G#2': 103.83, 'A2': 110.00, 'A#2': 116.54, 'B2': 123.47,
      'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
      'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
      'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99
    };

    // Index mapping for rendering on staff lines
    const NOTE_PITCH_INDEX = {
      'F2': 6, 'G2': 7, 'A2': 8, 'B2': 9,
      'C3': 10, 'D3': 11, 'E3': 12, 'F3': 13, 'G3': 14, 'A3': 15, 'B3': 16,
      'C4': 17, 'D4': 18, 'E4': 19, 'F4': 20, 'G4': 21, 'A4': 22, 'B4': 23,
      'C5': 24, 'D5': 25, 'E5': 26, 'F5': 27, 'G5': 28
    };

    // Mode Note Pools
    const POOLS = {
      treble: ['C4', 'C#4', 'D4', 'D#4', 'E4', 'F4', 'F#4', 'G4', 'G#4', 'A4', 'A#4', 'B4', 'C5'],
      bass: ['G2', 'G#2', 'A2', 'A#2', 'B2', 'C3', 'C#3', 'D3', 'D#3', 'E3', 'F3', 'F#3', 'G3', 'G#3', 'A3', 'A#3', 'B3', 'C4'],
      both: ['G2', 'G#2', 'A2', 'A#2', 'B2', 'C3', 'C#3', 'D3', 'D#3', 'E3', 'F3', 'F#3', 'G3', 'G#3', 'A3', 'A#3', 'B3', 'C4', 'C#4', 'D4', 'D#4', 'E4', 'F4', 'F#4', 'G4', 'G#4', 'A4', 'A#4', 'B4', 'C5']
    };

    // --- Main Game Engine ---
    class Game {
      constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.synth = new PianoSynth();

        this.score = 0;
        this.lives = 5;
        this.isRunning = false;
        this.cards = [];
        this.effects = [];
        this.spawnTimer = 0;

        this.settings = {
          clef: 'treble',
          speed: 1.3
        };

        this.initCanvasSize();
        this.bindEvents();
        this.setupKeyboardUI();
      }

      initCanvasSize() {
        const container = document.getElementById('stage-container');
        this.canvas.width = container.clientWidth;
        this.canvas.height = container.clientHeight;
      }

      bindEvents() {
        window.addEventListener('resize', () => this.initCanvasSize());

        document.getElementById('btn-start').addEventListener('click', () => {
          this.synth.init();
          this.readSettings();
          this.startGame();
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
          this.togglePause();
        });

        document.getElementById('btn-settings').addEventListener('click', () => {
          this.showModal('遊戲設定');
        });

        document.getElementById('clef-select').addEventListener('change', () => {
          this.readSettings();
        });

        this.initMIDI();
      }

      readSettings() {
        this.settings.clef = document.getElementById('clef-select').value;
        this.settings.speed = parseFloat(document.getElementById('speed-select').value);
        this.setupKeyboardUI();
      }

      getNotePool() {
        return POOLS[this.settings.clef] || POOLS.treble;
      }

      setupKeyboardUI() {
        const wrapper = document.getElementById('keys-wrapper');
        wrapper.innerHTML = '';
        const notes = this.getNotePool();

        document.getElementById('range-info').innerText = `琴鍵範圍: ${notes[0]} - ${notes[notes.length - 1]}`;

        notes.forEach(note => {
          const key = document.createElement('div');
          const isAccidental = note.includes('#');
          key.className = `piano-key ${isAccidental ? 'black' : 'white'}`;
          key.innerText = note;
          key.dataset.note = note;

          key.addEventListener('mousedown', () => this.handleKeyPress(note));
          key.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.handleKeyPress(note);
          });

          wrapper.appendChild(key);
        });
      }

      initMIDI() {
        if (navigator.requestMIDIAccess) {
          navigator.requestMIDIAccess().then(
            (midi) => {
              document.getElementById('midi-status').innerText = 'MIDI: 已連接';
              const inputs = midi.inputs.values();
              for (let input of inputs) {
                input.onmidimessage = (msg) => this.handleMIDIMessage(msg);
              }
            },
            () => {
              document.getElementById('midi-status').innerText = 'MIDI: 未存取';
            }
          );
        }
      }

      handleMIDIMessage(msg) {
        const [command, noteNumber, velocity] = msg.data;
        if (command === 144 && velocity > 0) {
          const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
          const noteName = noteNames[noteNumber % 12] + (Math.floor(noteNumber / 12) - 1);
          this.handleKeyPress(noteName);
        }
      }

      handleKeyPress(note) {
        if (!this.isRunning) return;

        if (NOTE_FREQS[note]) {
          this.synth.playNote(NOTE_FREQS[note]);
        }

        const keyEl = document.querySelector(`.piano-key[data-note="${note}"]`);
        if (keyEl) {
          keyEl.classList.add('active');
          setTimeout(() => keyEl.classList.remove('active'), 150);
        }

        for (let i = 0; i < this.cards.length; i++) {
          if (this.cards[i].note === note) {
            this.score += this.cards[i].isBoss ? 30 : 10;
            this.updateHUD();
            this.createHitEffect(this.cards[i].x, this.cards[i].y);
            this.cards.splice(i, 1);
            break;
          }
        }
      }

      createHitEffect(x, y) {
        for (let i = 0; i < 15; i++) {
          this.effects.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: `hsl(${Math.random() * 360}, 100%, 75%)`
          });
        }
      }

      spawnCard() {
        const pool = this.getNotePool().filter(n => !n.includes('#')); // 發出自然音
        const note = pool[Math.floor(Math.random() * pool.length)];

        let clef = this.settings.clef;
        if (clef === 'both') {
          const pitch = NOTE_PITCH_INDEX[note];
          clef = pitch >= 17 ? 'treble' : 'bass';
        }

        this.cards.push({
          x: this.canvas.width + 80,
          y: this.canvas.height * 0.45,
          note: note,
          clef: clef,
          speed: this.settings.speed * 1.6,
          isBoss: Math.random() < 0.15
        });
      }

      startGame() {
        this.score = 0;
        this.lives = 5;
        this.cards = [];
        this.effects = [];
        this.isRunning = true;
        this.updateHUD();
        document.getElementById('modal-overlay').classList.add('hidden');
        requestAnimationFrame(() => this.loop());
      }

      togglePause() {
        this.isRunning = !this.isRunning;
        if (!this.isRunning) {
          this.showModal('遊戲暫停');
        } else {
          document.getElementById('modal-overlay').classList.add('hidden');
          requestAnimationFrame(() => this.loop());
        }
      }

      showModal(title) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-overlay').classList.remove('hidden');
      }

      updateHUD() {
        document.getElementById('score-display').innerText = this.score;
        document.getElementById('lives-display').innerText = '❤️'.repeat(Math.max(0, this.lives));
      }

      loop() {
        if (!this.isRunning) return;

        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw Background
        this.drawBackground();

        // Spawn Cards with dynamic speed interval
        this.spawnTimer++;
        const spawnInterval = Math.max(35, Math.floor(130 / this.settings.speed));
        if (this.spawnTimer > spawnInterval) {
          this.spawnCard();
          this.spawnTimer = 0;
        }

        // Update & Render Cards
        for (let i = this.cards.length - 1; i >= 0; i--) {
          const card = this.cards[i];
          card.x -= card.speed;

          this.drawCardAndMonster(card);

          if (card.x < 150) {
            this.lives--;
            this.updateHUD();
            this.cards.splice(i, 1);

            if (this.lives <= 0) {
              this.isRunning = false;
              this.showModal('遊戲結束！最終得分: ' + this.score);
              return;
            }
          }
        }

        // Particle Effects
        for (let i = this.effects.length - 1; i >= 0; i--) {
          const p = this.effects[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.03;

          if (p.life <= 0) {
            this.effects.splice(i, 1);
          } else {
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = p.life;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.globalAlpha = 1.0;
          }
        }

        requestAnimationFrame(() => this.loop());
      }

      drawBackground() {
        const w = this.canvas.width;
        const h = this.canvas.height;

        // Sky Gradient
        const grad = this.ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#0284c7');
        grad.addColorStop(0.5, '#38bdf8');
        grad.addColorStop(1, '#7dd3fc');
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0, 0, w, h);

        // Ground Wall
        this.ctx.fillStyle = '#b45309';
        this.ctx.fillRect(0, h * 0.72, w, h * 0.28);
        this.ctx.fillStyle = '#d97706';
        this.ctx.fillRect(0, h * 0.72, w, 8);

        // Castle Base
        const castleX = 30;
        const castleY = h * 0.38;
        this.ctx.fillStyle = '#94a3b8';
        this.ctx.fillRect(castleX, castleY + 50, 90, 100);

        // Castle Roof
        this.ctx.fillStyle = '#2563eb';
        this.ctx.beginPath();
        this.ctx.moveTo(castleX - 10, castleY + 50);
        this.ctx.lineTo(castleX + 45, castleY);
        this.ctx.lineTo(castleX + 100, castleY + 50);
        this.ctx.fill();

        // Hero Character
        this.ctx.fillStyle = '#ec4899';
        this.ctx.beginPath();
        this.ctx.arc(castleX + 45, castleY - 20, 16, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.fillStyle = '#fde047';
        this.ctx.beginPath();
        this.ctx.arc(castleX + 45, castleY - 26, 18, Math.PI, Math.PI * 2);
        this.ctx.fill();
      }

      drawCardAndMonster(card) {
        const w = 105;
        const h = 140;
        const x = card.x - w / 2;
        const y = card.y - h / 2;

        // Card White Background
        this.ctx.fillStyle = '#ffffff';
        this.ctx.shadowColor = 'rgba(0,0,0,0.25)';
        this.ctx.shadowBlur = 8;
        this.ctx.beginPath();
        this.ctx.roundRect(x, y, w, h, 10);
        this.ctx.fill();
        this.ctx.shadowBlur = 0;

        // Staff Lines (Exactly 5 horizontal lines)
        this.ctx.strokeStyle = '#1e293b';
        this.ctx.lineWidth = 1.5;
        const staffTop = y + 36;
        const lineSpacing = 11;

        for (let i = 0; i < 5; i++) {
          const lineY = staffTop + i * lineSpacing;
          this.ctx.beginPath();
          this.ctx.moveTo(x + 8, lineY);
          this.ctx.lineTo(x + w - 8, lineY);
          this.ctx.stroke();
        }

        // Draw Pure Vector Clef Shapes (NO Emoji background lines)
        this.ctx.fillStyle = '#0f172a';
        if (card.clef === 'treble') {
          this.drawTrebleClefPath(x + 12, staffTop - 5);
        } else {
          this.drawBassClefPath(x + 14, staffTop + 11);
        }

        // Pitch Index Calculation
        const pitchIndex = NOTE_PITCH_INDEX[card.note] || 17;
        const baseIndex = card.clef === 'treble' ? 19 : 7; // E4 vs G2
        const stepOffset = pitchIndex - baseIndex;

        const noteY = staffTop + 44 - (stepOffset * (lineSpacing / 2));
        const noteX = x + w / 2 + 14;

        // Short Ledger Line
        if (stepOffset < 0 || stepOffset > 8) {
          const ledgerStart = Math.min(0, stepOffset);
          const ledgerEnd = Math.max(8, stepOffset);

          for (let s = ledgerStart; s <= ledgerEnd; s++) {
            if ((s < 0 || s > 8) && Math.abs(s % 2) === 0) {
              const ly = staffTop + 44 - (s * (lineSpacing / 2));
              this.ctx.beginPath();
              this.ctx.moveTo(noteX - 10, ly);
              this.ctx.lineTo(noteX + 10, ly);
              this.ctx.stroke();
            }
          }
        }

        // Note Head
        this.ctx.fillStyle = '#0f172a';
        this.ctx.beginPath();
        this.ctx.ellipse(noteX, noteY, 5.5, 4, -Math.PI / 12, 0, Math.PI * 2);
        this.ctx.fill();

        // Note Stem
        this.ctx.beginPath();
        if (stepOffset >= 4) {
          this.ctx.moveTo(noteX - 4.5, noteY);
          this.ctx.lineTo(noteX - 4.5, noteY + 22);
        } else {
          this.ctx.moveTo(noteX + 4.5, noteY);
          this.ctx.lineTo(noteX + 4.5, noteY - 22);
        }
        this.ctx.stroke();

        // Monster/Boss Icon
        this.ctx.fillStyle = card.isBoss ? '#7c3aed' : '#ea580c';
        this.ctx.beginPath();
        this.ctx.arc(x + w / 2, y + h + 14, card.isBoss ? 18 : 12, 0, Math.PI * 2);
        this.ctx.fill();
      }

      // Vector Path Treble Clef
      drawTrebleClefPath(cx, cy) {
        this.ctx.save();
        this.ctx.translate(cx, cy);
        this.ctx.scale(0.65, 0.65);
        this.ctx.lineWidth = 2.5;
        this.ctx.strokeStyle = '#0f172a';
        
        this.ctx.beginPath();
        this.ctx.arc(12, 42, 3, 0, Math.PI * 2);
        this.ctx.moveTo(12, 42);
        this.ctx.bezierCurveTo(24, 30, 24, 15, 12, 15);
        this.ctx.bezierCurveTo(0, 15, 0, 32, 14, 48);
        this.ctx.bezierCurveTo(22, 58, 20, 75, 10, 75);
        this.ctx.bezierCurveTo(2, 75, -2, 65, 5, 58);
        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.moveTo(10, 75);
        this.ctx.lineTo(10, -5);
        this.ctx.bezierCurveTo(10, -20, 2, -20, 2, -10);
        this.ctx.bezierCurveTo(2, 0, 10, 20, 10, 40);
        this.ctx.stroke();

        this.ctx.restore();
      }

      // Vector Path Bass Clef
      drawBassClefPath(cx, cy) {
        this.ctx.save();
        this.ctx.translate(cx, cy);
        this.ctx.scale(0.85, 0.85);
        this.ctx.fillStyle = '#0f172a';
        this.ctx.strokeStyle = '#0f172a';
        this.ctx.lineWidth = 3;

        // Main Dot
        this.ctx.beginPath();
        this.ctx.arc(4, 4, 4, 0, Math.PI * 2);
        this.ctx.fill();

        // Arc Curve
        this.ctx.beginPath();
        this.ctx.moveTo(4, 4);
        this.ctx.bezierCurveTo(16, -6, 22, 10, 12, 26);
        this.ctx.bezierCurveTo(8, 32, 2, 36, -2, 38);
        this.ctx.stroke();

        // Two Dots (F-line dots)
        this.ctx.beginPath();
        this.ctx.arc(22, 0, 2.5, 0, Math.PI * 2);
        this.ctx.arc(22, 12, 2.5, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.restore();
      }
    }

    // Launch Engine
    window.addEventListener('load', () => {
      new Game();
    });
  </script>
